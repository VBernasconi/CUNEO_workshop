<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo Similarity Gallery</title>

    <script src="https://cdn.jsdelivr.net/npm/heic2any/dist/heic2any.min.js"></script>
    <link rel="stylesheet" href="css/gallery.css">


</head>


<body>


    <!-- Controls -->

    <div id="controls">


        <label>
            Geo location

            <input 
                type="range"
                id="geoWeight"
                min="0"
                max="100"
                value="50">
        </label>


        <label>
            Time

            <input 
                type="range"
                id="timeWeight"
                min="0"
                max="100"
                value="30">
        </label>



        <label>
            AI content

            <input 
                type="range"
                id="semanticWeight"
                min="0"
                max="100"
                value="70">
        </label>



        <label>
            Colors

            <input 
                type="range"
                id="colorWeight"
                min="0"
                max="100"
                value="20">
        </label>


        <button id="loadGallery">
            Load Gallery
        </button>


    </div>



    <!-- Image grid -->

    <main id="gallery">


    </main>



    <!-- Status -->

    <div id="status">

        Waiting...

    </div>

    <!-- GeoPackage + SQL.js -->
    <script src="https://unpkg.com/@ngageoint/geopackage/dist/geopackage.min.js"></script>
    <script>
        GeoPackage.setSqljsWasmLocateFile(
            filename =>
                "https://unpkg.com/@ngageoint/geopackage/dist/" + filename
        );
    </script>
    <script type="module" src="./js/app-gallery.js"></script>
    <script type="module" src="./js/app-gallery.js"></script>

</body>

</html>
